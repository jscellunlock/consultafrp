<!-- SEO Google -->

<!-- Open Graph (WhatsApp / Facebook / Telegram) -->
<meta property="og:title" content="Consulta dispositivo FRP via IMEI">
<meta property="og:description" content="Verifique se o dispositivo suporta FRP via IMEI antes de fazer o pedido.">
<meta property="og:image" content="https://consultafrp.netlify.app/img/logo2.png">

<!-- Twitter / Telegram preview -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Consulta dispositivo FRP via IMEI">
<meta name="twitter:description" content="Verifique se o dispositivo suporta FRP via IMEI antes de fazer o pedido.">

<!-- favicon -->
<link rel="icon" href="https://consultafrp.netlify.app/img/logo2.png">

<link rel="stylesheet" href="consulta.css">

</head>
  <body>
    <div class="container">
      <!-- MENU PRINCIPAL com nome Devices e botão lua/sol -->
      <nav class="navbar">
        <div class="logo-devices">📱 Devices <span>472</span></div>
        <button
          class="theme-toggle"
          id="themeToggleBtn"
          aria-label="Alternar tema"
        >
          🌙
          <!-- começa com lua — tema claro padrão (lua significa "mudar para escuro") -->
        </button>
      </nav>

      <div class="header">
        <h1>Consulta dispositivo FRP via IMEI Suportando</h1>
        <div class="subhead">pesquise por modelo ou variante</div>
      </div>

      <div class="search-wrapper">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Ex: Galaxy S24, SM-S928B, A54"
        />
      </div>
      <div class="result-count" id="resultCount">
        Mostrando 472 dispositivos
      </div>

      <div class="devices-grid" id="devicesGrid"></div>
      <div class="footer-note">✅ cartões compactos · tema dinâmico</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
